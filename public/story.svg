<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Notre histoire Warda Beauté">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE6EC"/>
      <stop offset="1" stop-color="#F7DEE6"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9A24B"/>
      <stop offset="1" stop-color="#7A2E4E"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- argan / leaf motif -->
  <g transform="translate(400 300)" opacity="0.9">
    <path d="M0,-160 C90,-60 90,60 0,160 C-90,60 -90,-60 0,-160 Z" fill="url(#leaf)" opacity="0.8"/>
    <path d="M0,-160 L0,160" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3"/>
    <g stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="2">
      <path d="M0,-90 C30,-70 30,-40 0,-20"/>
      <path d="M0,10 C30,-10 30,40 0,60"/>
      <path d="M0,-90 C-30,-70 -30,-40 0,-20"/>
      <path d="M0,10 C-30,-10 -30,40 0,60"/>
    </g>
  </g>

  <circle cx="650" cy="120" r="70" fill="#C75B8A" opacity="0.18"/>
  <circle cx="140" cy="500" r="90" fill="#E8A9C0" opacity="0.25"/>

  <text x="400" y="540" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="700" fill="#7A2E4E">Née à Marrakech</text>
  <text x="400" y="578" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#C75B8A">مغربية الأصل · ingrédients naturels</text>
</svg>
