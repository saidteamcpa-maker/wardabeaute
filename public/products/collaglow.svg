<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="CollaGlow gummies collagène">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE6EC"/><stop offset="1" stop-color="#FBF6F2"/>
    </linearGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8A9C0"/><stop offset="1" stop-color="#C9A24B"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9A24B"/><stop offset="1" stop-color="#a8842f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="220" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="110" cy="160" r="46" fill="#C9A24B" opacity="0.3"/>
  <circle cx="500" cy="180" r="40" fill="#E8A9C0" opacity="0.3"/>

  <!-- gummies jar -->
  <g transform="translate(300 400)">
    <rect x="-90" y="-140" width="180" height="40" rx="14" fill="url(#lid)"/>
    <rect x="-84" y="-110" width="168" height="270" rx="26" fill="url(#jar)"/>
    <!-- gummies -->
    <g fill="#C75B8A">
      <circle cx="-40" cy="-40" r="20"/><circle cx="20" cy="-20" r="20"/>
      <circle cx="-10" cy="20" r="20"/><circle cx="45" cy="40" r="20"/>
      <circle cx="-50" cy="55" r="18"/><circle cx="35" cy="-60" r="18"/>
    </g>
    <g fill="#FFFFFF" opacity="0.5">
      <circle cx="-46" cy="-46" r="6"/><circle cx="14" cy="-26" r="6"/>
      <circle cx="-16" cy="14" r="6"/><circle cx="39" cy="34" r="6"/>
    </g>
    <rect x="-70" y="80" width="140" height="60" rx="12" fill="#FFFFFF" opacity="0.92"/>
    <text x="0" y="112" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#7A2E4E">CollaGlow™</text>
    <text x="0" y="135" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#C75B8A">كولا غلو</text>
  </g>

  <text x="300" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#7A2E4E">Warda Beauté</text>
</svg>
