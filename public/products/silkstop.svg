<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="SilkStop huile anti-repousse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7DEE6"/><stop offset="1" stop-color="#FBF6F2"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C75B8A"/><stop offset="1" stop-color="#7A2E4E"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a2139"/><stop offset="1" stop-color="#3f1728"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="220" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="120" cy="170" r="46" fill="#7A2E4E" opacity="0.22"/>
  <circle cx="490" cy="150" r="38" fill="#C75B8A" opacity="0.28"/>

  <!-- oil bottle with pump -->
  <g transform="translate(300 400)">
    <rect x="-30" y="-180" width="60" height="20" rx="6" fill="url(#cap)"/>
    <path d="M30,-175 L72,-185 L72,-168 L30,-160 Z" fill="url(#cap)"/>
    <rect x="-22" y="-160" width="44" height="36" rx="6" fill="url(#cap)"/>
    <rect x="-78" y="-120" width="156" height="255" rx="26" fill="url(#bottle)"/>
    <rect x="-64" y="-106" width="38" height="220" rx="16" fill="#FFFFFF" opacity="0.3"/>
    <rect x="-58" y="-40" width="116" height="145" rx="14" fill="#FFFFFF" />
    <text x="0" y="10" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#7A2E4E">Silk</text>
    <text x="0" y="42" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="700" fill="#7A2E4E">Stop™</text>
    <text x="0" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#C75B8A">سيلك ستوب</text>
    <text x="0" y="118" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="2" fill="#9a5a73">HUILE</text>
  </g>

  <text x="300" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#7A2E4E">Warda Beauté</text>
</svg>
