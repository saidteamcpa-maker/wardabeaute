<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" role="img" aria-label="VelvaStretch sérum anti-vergetures">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE6EC"/><stop offset="1" stop-color="#FBF6F2"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8A9C0"/><stop offset="1" stop-color="#C75B8A"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A2E4E"/><stop offset="1" stop-color="#5a2139"/>
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#bg)"/>
  <circle cx="300" cy="330" r="220" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="110" cy="140" r="50" fill="#E8A9C0" opacity="0.3"/>
  <circle cx="500" cy="170" r="40" fill="#C75B8A" opacity="0.25"/>

  <!-- dropper bottle -->
  <g transform="translate(300 400)">
    <rect x="-34" y="-170" width="68" height="26" rx="8" fill="url(#cap)"/>
    <rect x="-22" y="-150" width="44" height="40" rx="6" fill="url(#cap)"/>
    <rect x="-80" y="-110" width="160" height="250" rx="28" fill="url(#bottle)"/>
    <rect x="-66" y="-96" width="40" height="210" rx="18" fill="#FFFFFF" opacity="0.35"/>
    <rect x="-58" y="-30" width="116" height="140" rx="14" fill="#FFFFFF" opacity="0.92"/>
    <text x="0" y="20" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#7A2E4E">Velva</text>
    <text x="0" y="50" text-anchor="middle" font-family="Georgia, serif" font-size="26" font-weight="700" fill="#7A2E4E">Stretch™</text>
    <text x="0" y="95" text-anchor="middle" font-family="Georgia, serif" font-size="18" fill="#C75B8A">فيلفا ستراتش</text>
    <text x="0" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="2" fill="#9a5a73">SÉRUM</text>
  </g>

  <text x="300" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="22" fill="#7A2E4E">Warda Beauté</text>
</svg>
