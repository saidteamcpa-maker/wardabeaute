# Full-stack deploy for EasyPanel (Docker Compose project)
# - frontend: Next.js (port 3000)
# - backend:  FastAPI (port 8000)
# - postgres: database (persistent volume)
#
# Domains:
#   wardabeaute.com      -> frontend (port 3000)
#   api.wardabeaute.com  -> backend  (port 8000)

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://warda:eyt5p216l73pesz9g3cl@wardabeaute_wardabeaute:5432/database?sslmode=disable
      NEXT_PUBLIC_API_URL: https://api.wardabeaute.com
      NEXT_PUBLIC_SITE_URL: https://wardabeaute.com
      NEXT_PUBLIC_WHATSAPP_NUMBER: 212600000000
      NEXT_PUBLIC_PIXELS_ENABLED: "true"
      NEXT_PUBLIC_FB_PIXEL_ID: ${NEXT_PUBLIC_FB_PIXEL_ID:-}
      NEXT_PUBLIC_TIKTOK_PIXEL_ID: ${NEXT_PUBLIC_TIKTOK_PIXEL_ID:-}
      NEXT_PUBLIC_GTM_ID: ${NEXT_PUBLIC_GTM_ID:-}
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: Saidecom324@
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - wardabeaute_database
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://warda:eyt5p216l73pesz9g3cl@wardabeaute_wardabeaute:5432/database?sslmode=disable
      CORS_ORIGINS: https://wardabeaute.com,https://www.wardabeaute.com,http://localhost:3000
      SHEETS_WEBHOOK_URL: ${SHEETS_WEBHOOK_URL:-}
      MAXMIND_DB_PATH: ${MAXMIND_DB_PATH:-}
      MAXMIND_ENABLED: ${MAXMIND_ENABLED:-false}
      WHITELIST_PHONES: ${WHITELIST_PHONES:-0666666666}
      FB_PIXEL_ID: ${FB_PIXEL_ID:-}
      FB_CAPI_TOKEN: ${FB_CAPI_TOKEN:-}
      TT_PIXEL_ID: ${TT_PIXEL_ID:-}
      TT_CAPI_TOKEN: ${TT_CAPI_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      - wardabeaute_database
    restart: unless-stopped

  wardabeaute_database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: warda
      POSTGRES_PASSWORD: eyt5p216l73pesz9g3cl
      POSTGRES_DB: database
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warda -d database"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
