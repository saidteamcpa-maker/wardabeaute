# Full-stack deploy for EasyPanel (Docker Compose project)
# - frontend: Next.js (port 3000)
# - backend:  FastAPI (port 8000)
# - postgres: database (persistent volume)
#
# In EasyPanel, create a "Docker Compose" project pointing to this repo
# and set the environment variables below (or use EasyPanel's UI).

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Must be the PUBLIC URL the browser uses to reach the backend service.
        # In EasyPanel set this to your backend domain (e.g. https://api.wardabeaute.com).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://wardabeaute:wardabeaute324@wardabeaute_database:5432/wardabeaute?sslmode=disable
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,https://wardabeaute.com}
      SHEETS_WEBHOOK_URL: ${SHEETS_WEBHOOK_URL:-}
      MAXMIND_DB_PATH: ${MAXMIND_DB_PATH:-}
      MAXMIND_ENABLED: ${MAXMIND_ENABLED:-false}
      WHITELIST_PHONES: ${WHITELIST_PHONES:-0666666666}
      FB_PIXEL_ID: ${FB_PIXEL_ID:-}
      FB_CAPI_TOKEN: ${FB_CAPI_TOKEN:-}
      TT_PIXEL_ID: ${TT_PIXEL_ID:-}
      TT_CAPI_TOKEN: ${TT_CAPI_TOKEN:-}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      ADMIN_SECRET: ${ADMIN_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
      - wardabeaute_database
    restart: unless-stopped

  wardabeaute_database:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wardabeaute
      POSTGRES_PASSWORD: wardabeaute324
      POSTGRES_DB: wardabeaute
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
